<!DOCTYPE html>
<html lang="en">

<script>
/* =========================================================
   Standalone local-storage adapter for AV Project Command Center.
   Drop-in replacement for the Claude Artifact `db` + `downloads`
   capabilities so this page runs as a plain, self-hosted HTML file —
   no external platform, no account, no network call.

   Trade-off vs. the Claude-hosted version: data lives only in THIS
   browser's local storage on THIS device. It is not synced across
   tabs on a schedule (only pushed live to other open tabs of the same
   browser), not shared across your team, and is lost if the browser's
   site data is cleared. Use the Claude-hosted version for real
   multi-person, multi-device use; use this file when you need a
   quick copy to demo or run on your own domain.
   ========================================================= */
(function(){
  const STORE_KEY = 'avcc_local_store_v1';
  let store = {};
  let storageOK = true;
  try {
    const raw = localStorage.getItem(STORE_KEY);
    store = raw ? JSON.parse(raw) : {};
  } catch(e){ storageOK = false; store = {}; }

  function persist(){
    if(!storageOK) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); }
    catch(e){ /* quota or blocked storage — keep working in memory */ }
  }

  const listeners = new Map(); // collectionPath -> [{q, next}]
  let counter = 0;
  function genId(){ return 'l' + Date.now().toString(36) + (counter++); }

  function computeSnapshot(path, q){
    const prefix = path + '/';
    const docs = Object.keys(store)
      .filter(p => p.startsWith(prefix) && p.slice(prefix.length).indexOf('/') === -1)
      .map(p => ({ id: p.split('/').pop(), exists: true, data: () => store[p] }));
    let out = docs;
    (q.wheres || []).forEach(w => {
      out = out.filter(d => {
        const v = d.data()[w.f];
        if (w.op === '==') return v === w.v;
        if (w.op === '!=') return v !== w.v;
        return true;
      });
    });
    if (q.order) {
      out.sort((a, b) => {
        const av = a.data()[q.order.f] ?? '', bv = b.data()[q.order.f] ?? '';
        let c = av < bv ? -1 : av > bv ? 1 : 0;
        return q.order.dir === 'desc' ? -c : c;
      });
    }
    if (q.lim) out = out.slice(0, q.lim);
    return { docs: out, size: out.length, empty: out.length === 0, docChanges: () => [], metadata: { fromCache: false, hasPendingWrites: false } };
  }
  function notify(path){
    (listeners.get(path) || []).forEach(({ q, next }) => { try { next(computeSnapshot(path, q)); } catch(e){ console.error(e); } });
  }
  function subscribe(path, q, next){
    const entry = { q, next };
    if (!listeners.has(path)) listeners.set(path, []);
    listeners.get(path).push(entry);
    Promise.resolve().then(() => next(computeSnapshot(path, q)));
    return () => { const arr = listeners.get(path); const i = arr.indexOf(entry); if (i >= 0) arr.splice(i, 1); };
  }
  function makeQuery(path, q){
    return {
      path,
      where: (f, op, v) => makeQuery(path, { ...q, wheres: [...(q.wheres||[]), { f, op, v }] }),
      orderBy: (f, dir) => makeQuery(path, { ...q, order: { f, dir: dir || 'asc' } }),
      limit: (n) => makeQuery(path, { ...q, lim: n }),
      get: async () => computeSnapshot(path, q),
      onSnapshot: (next) => subscribe(path, q, next),
      doc: (id) => makeDocRef(path + '/' + (id || genId())),
      add: async (data) => { const id = genId(); const p = path + '/' + id; store[p] = { ...data }; persist(); notify(path); return makeDocRef(p); },
    };
  }
  function makeDocRef(path){
    const parent = path.split('/').slice(0, -1).join('/');
    return {
      id: path.split('/').pop(),
      path,
      get: async () => ({ id: path.split('/').pop(), exists: !!store[path], data: () => store[path], metadata: { fromCache:false, hasPendingWrites:false } }),
      set: async (data) => { store[path] = { ...data }; persist(); notify(parent); },
      update: async (data) => {
        if (!store[path]) throw { code: 'invalid_argument', message: 'document does not exist: ' + path };
        store[path] = { ...store[path], ...data }; persist(); notify(parent);
      },
      delete: async () => { delete store[path]; persist(); notify(parent); },
      onSnapshot: (next) => {
        Promise.resolve().then(() => next({ id: path.split('/').pop(), exists: !!store[path], data: () => store[path] }));
        return () => {};
      },
      collection: (sub) => makeQuery(path + '/' + sub, {}),
    };
  }
  const db = { doc: (p) => makeDocRef(p), collection: (p) => makeQuery(p, {}) };

  const downloads = {
    save: async ({ filename, data }) => {
      const blob = data instanceof Blob ? data : new Blob([data], { type: 'text/plain' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      return { status: 'saved' };
    }
  };

  window.claude = { use: async (name) => name === 'db' ? db : name === 'downloads' ? downloads : null };

    const put = (path, data) => { store[path] = data; };
    put('clients/client-nshm', { name:"National Science & Heritage Museum Trust", contactPerson:"Anjali Mehta", designation:"Director – Capital Projects", email:"anjali.mehta@nshmtrust.org", phone:"+91 22 6789 0123", whatsapp:"+91 98200 12345", address:"Museum Campus, Bhau Daji Lad Road, Byculla, Mumbai 400027", notes:"Government-affiliated trust; procurement runs through empanelled vendors, PMU sign-off required on every change request.", createdAt:"2026-03-20T09:00:00.000Z" });

    acts.forEach(([id,text,ts]) => put(`activity_log/${id}`, { projectId:"proj-museum", projectName:"Corporate Museum AV Integration", text, ts }));

  window.addEventListener('DOMContentLoaded', () => {

<body>
<title>AV Project Command Center</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f4; --surface-3:#e4e7ed;
  --border:#d7dce3; --border-strong:#b7c0cc;
  --text:#1a2230; --text-dim:#5c6674; --text-faint:#8993a3;
  --primary:#1e3a5f; --primary-tint:#e7edf5; --primary-hover:#16304f;
  --accent:#c96a2e; --accent-tint:#fbeee2;
  --good:#1f9d55; --good-tint:#e6f7ed;
  --warn:#b9860b; --warn-tint:#fdf3dc;
  --critical:#c73e3e; --critical-tint:#fbe9e9;
  --info:#2f6fed; --info-tint:#e8effd;
  --shadow: 0 1px 2px rgba(20,26,37,.06), 0 8px 24px -12px rgba(20,26,37,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10141c; --surface:#171c26; --surface-2:#1e2430; --surface-3:#262d3b;
    --border:#2b3242; --border-strong:#3b4457;
    --text:#e7eaf0; --text-dim:#a7b0c0; --text-faint:#6d7690;
    --primary:#87acdc; --primary-tint:#1c2c42; --primary-hover:#a3c0ea;
    --accent:#e2934f; --accent-tint:#3a2a1c;
    --good:#4bc37e; --good-tint:#16301f;
    --warn:#e0b23e; --warn-tint:#382d10;
    --critical:#e8706f; --critical-tint:#391d1d;
    --info:#7ba0f5; --info-tint:#1b2740;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#171c26; --surface-2:#1e2430; --surface-3:#262d3b;
  --border:#2b3242; --border-strong:#3b4457;
  --text:#e7eaf0; --text-dim:#a7b0c0; --text-faint:#6d7690;
  --primary:#87acdc; --primary-tint:#1c2c42; --primary-hover:#a3c0ea;
  --accent:#e2934f; --accent-tint:#3a2a1c;
  --good:#4bc37e; --good-tint:#16301f;
  --warn:#e0b23e; --warn-tint:#382d10;
  --critical:#e8706f; --critical-tint:#391d1d;
  --info:#7ba0f5; --info-tint:#1b2740;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 24px -12px rgba(0,0,0,.55);
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'IBM Plex Sans', system-ui, sans-serif; font-size:14px; line-height:1.5;
}
h1,h2,h3,h4{font-family:'Archivo', system-ui, sans-serif; font-weight:700; text-wrap:balance; color:var(--text); margin:0;}
code,.mono{font-family:'IBM Plex Mono', monospace;}
a{color:var(--primary); text-decoration:none;}
button{font-family:inherit;}
::selection{background:var(--accent-tint);}

/* ---------- shell ---------- */
#topbar{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  padding:11px 20px; background:var(--surface); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20;
}
.brand{font-family:'Archivo'; font-weight:800; font-size:16px; letter-spacing:.01em; display:flex; align-items:center; gap:8px;}
.brand .mark{
  width:26px; height:26px; border-radius:6px; background:var(--primary); color:#fff;
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; font-family:'IBM Plex Mono';
}
.brand span.dim{color:var(--text-faint); font-weight:500; font-size:12.5px; margin-left:2px;}
.env-badge{
  font-family:'IBM Plex Mono'; font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  background:var(--good-tint); color:var(--good); padding:3px 9px; border-radius:20px; font-weight:600;
}
#shell{display:grid; grid-template-columns:200px 1fr; min-height:calc(100% - 48px);}
#sidebar{
  border-right:1px solid var(--border); background:var(--surface); padding:16px 10px; display:flex; flex-direction:column;
  position:sticky; top:48px; align-self:start; height:calc(100vh - 48px);
}
#sidebar a{
  display:flex; align-items:center; gap:9px; padding:9px 12px; border-radius:6px; color:var(--text-dim);
  font-size:13.3px; font-weight:500; margin-bottom:2px;
}
#sidebar a:hover{background:var(--surface-2); color:var(--text);}
#sidebar a.active{background:var(--primary-tint); color:var(--primary); font-weight:600;}
#sidebar a .ico{width:16px; text-align:center; font-size:13px;}
.sidebar-footer{margin-top:auto; padding:10px 12px; border-top:1px solid var(--border);}
.sidebar-footer a{font-size:11.5px; color:var(--text-faint); display:block;}
.sidebar-footer a:hover{color:var(--accent);}
#app{padding:22px 26px 60px; max-width:1180px;}
@media (max-width:860px){
  #shell{grid-template-columns:1fr;}
  #sidebar{position:static; height:auto; flex-direction:row; overflow-x:auto; padding:8px 10px; gap:4px;}
  #sidebar a{white-space:nowrap;}
  .sidebar-footer{display:none;}
}

/* ---------- basics ---------- */
.page-head{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; margin-bottom:18px; flex-wrap:wrap;}
.page-head h1{font-size:21px;}
.page-head .lede{color:var(--text-dim); font-size:12.8px; margin-top:3px;}
.crumb{font-size:12px; color:var(--text-faint); margin-bottom:6px;}
.crumb a{color:var(--text-faint);}
.crumb a:hover{color:var(--primary);}

.btn{
  border:1px solid var(--border-strong); background:var(--surface); color:var(--text);
  padding:8px 14px; border-radius:6px; font-size:12.8px; font-weight:600; cursor:pointer; white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn.primary{background:var(--primary); border-color:var(--primary); color:#fff;}
.btn.primary:hover{background:var(--primary-hover);}
.btn.ghost{background:transparent; border-color:transparent;}
.btn.ghost:hover{background:var(--surface-2);}
.btn.danger-ghost{background:transparent; border-color:var(--critical); color:var(--critical);}
.btn.danger-ghost:hover{background:var(--critical-tint);}
.btn.sm{padding:5px 10px; font-size:11.8px;}
.btn:disabled{opacity:.55; cursor:default;}
.btn:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}
.icon-btn{border:none; background:transparent; color:var(--text-dim); font-size:15px; cursor:pointer; padding:4px 6px; border-radius:5px;}
.icon-btn:hover{background:var(--surface-2); color:var(--text);}

<script>
/* =========================================================
   AV PROJECT COMMAND CENTER — Phase 1 MVP
   ========================================================= */

/* ---------- enums ---------- */
const EQUIPMENT_CATEGORIES = ["Display","Projector","Projection Screen","LED Display","Video Wall","Processor","Video Matrix","Switch","Router","Firewall","Access Point","Computer","Server","NUC","Media Player","Touch Panel","Control Processor","Audio DSP","Amplifier","Mixer","Speaker","Directional Speaker","Microphone","Wireless Microphone","DI Box","Cable","Connector","Rack","UPS","PDU","Mount","Bracket","Sensor","Lighting","Other"];
const PROJECT_STATUS = ["Planning","Design","Procurement","Installation","Testing","Commissioning","Handover","Completed","On Hold"];
const HEALTH_OPTS = ["Green","Yellow","Red","Blue"];
const HEALTH_COLOR = {Green:"good",Yellow:"warn",Red:"critical",Blue:"info"};
const ROOM_TYPES = ["Meeting Room","Exhibit / Gallery","Control Room","Server Room","Auditorium","Lobby / Reception","Common Area","Other"];
const ROOM_STATUS = ["Not Started","In Progress","Installed","Testing","Commissioned"];
const UNITS = ["Nos","Set","Mtr","Lot","Job","Pair"];
const AVAILABILITY = ["Available","Lead Time","Backorder","Discontinued"];
const PROC_STATUS = ["Not Required","RFQ","Quotation Received","PO Released","Ordered","In Transit","Received","Installed"];
const TASK_PRIORITY = ["Low","Medium","High","Critical"];
const TASK_STATUS = ["Not Started","In Progress","Waiting","Completed","Delayed","Blocked"];
const DOC_CATEGORY = ["BOQ","Quotation","PO","Invoice","Datasheet","Drawing","SLD","Network Diagram","Rack Drawing","Layout","Method Statement","Test Report","Commissioning Report","MOM","Client Approval","Warranty","AMC","Handover Document","Photo","Video","Other"];
const DOC_STATUS = ["Draft","Submitted","Under Review","Approved","Rejected"];

/* ---------- utils ---------- */
function escapeHtml(s){ return String(s===undefined||s===null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtINR(n){
  n = Math.round(Number(n)||0);
  const neg = n<0; n = Math.abs(n);
  let s = String(n);
  let lastThree = s.length>3 ? s.slice(-3) : s;
  let rest = s.length>3 ? s.slice(0,-3) : '';
  if(rest) rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return (neg?'-':'') + '₹' + (rest ? rest+',' : '') + lastThree;
}
function fmtDate(s){
  if(!s) return '—';
  const d = new Date(s+'T00:00:00');
  if(isNaN(d)) return s;
  return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}
function todayStr(){ return new Date().toISOString().slice(0,10); }
function isOverdue(dueDate, status){ return !!dueDate && dueDate < todayStr() && status!=='Completed'; }
function pill(text, cls){ return `<span class="pill ${cls}">${escapeHtml(text||'—')}</span>`; }
function dot(cls, title){ return `<span class="dot ${cls}" title="${escapeHtml(title||'')}"></span>`; }
function healthPillCls(h){ return HEALTH_COLOR[h] || 'dim'; }
function taskStatusCls(s){
  if(s==='Completed') return 'good';
  if(s==='In Progress') return 'info';
  if(s==='Delayed'||s==='Blocked') return 'critical';
  return 'dim';
}
function priorityCls(p){
  if(p==='Critical') return 'critical'; if(p==='High') return 'warn'; if(p==='Medium') return 'info'; return 'dim';
}
function docStatusCls(s){
  if(s==='Approved') return 'good'; if(s==='Rejected') return 'critical'; if(s==='Under Review'||s==='Submitted') return 'info'; return 'dim';
}
function roomStatusCls(s){
  if(s==='Commissioned') return 'good'; if(s==='Testing'||s==='Installed') return 'info'; if(s==='In Progress') return 'warn'; return 'dim';
}
function procStatusCls(s){
  if(s==='Installed'||s==='Received') return 'good'; if(s==='Ordered'||s==='In Transit'||s==='PO Released') return 'info'; if(s==='Not Required') return 'dim'; return 'warn';
}
function csvEscape(v){ v = v===undefined||v===null?'':String(v); return /[",\n\r]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }

function boqCalc(item){
  const qty = Number(item.qty)||0, rate = Number(item.rate)||0, margin = Number(item.marginPct)||0,
        disc = Number(item.discountPct)||0, gst = Number(item.gstPct)||0;
  const sellRate = rate * (1+margin/100);
  const gross = sellRate*qty;
  const discAmt = gross*disc/100;
  const afterDisc = gross-discAmt;
  const gstAmt = afterDisc*gst/100;
  const total = afterDisc+gstAmt;
  const cost = rate*qty;
  const profit = afterDisc-cost;
  const profitPct = afterDisc>0 ? (profit/afterDisc*100) : 0;
  return {sellRate,gross,discAmt,afterDisc,gstAmt,total,cost,profit,profitPct};
}

/* ---------- toast ---------- */
function toast(msg, kind='info', ms=3400){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast '+(kind==='info'?'':kind);
  el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),300); }, ms);
}

/* ---------- state ---------- */
let db = null, downloadsCap = null;
let clients = [], projects = [], equipment = [];
let portfolioTasks = {}, portfolioBoq = {};
let portfolioSubs = {};
let currentProjectId = null, projectSubs = [];
let pdata = { rooms:[], docs:[], activity:[] };
let renderScheduled = false;

function scheduleRender(){
  if(renderScheduled) return;
  renderScheduled = true;
  setTimeout(()=>{ renderScheduled = false; renderRoute(); }, 0);
}

function syncPortfolioSubs(){
  const ids = new Set(projects.map(p=>p.id));
  ids.forEach(pid=>{
    [['tasks',portfolioTasks],['boq_items',portfolioBoq]].forEach(([coll,bucket])=>{
      const key = coll+':'+pid;
      if(!portfolioSubs[key]){
        portfolioSubs[key] = db.collection(`projects/${pid}/${coll}`).onSnapshot(snap=>{
          bucket[pid] = snap.docs.map(d=>({id:d.id, projectId:pid, ...d.data()}));
          scheduleRender();
        }, err=>console.error('sub error', coll, err));
      }
    });
  });
  Object.keys(portfolioSubs).forEach(key=>{
    const pid = key.split(':')[1];
    if(!ids.has(pid)){
      portfolioSubs[key](); delete portfolioSubs[key];
      delete portfolioTasks[pid]; delete portfolioBoq[pid];
    }
  });
}

function ensureProjectSubs(id){
  if(currentProjectId===id) return;
  projectSubs.forEach(u=>u());
  projectSubs = [];
  currentProjectId = id;
  pdata = { rooms:[], docs:[], activity:[] };
  projectSubs.push(db.collection(`projects/${id}/rooms`).onSnapshot(snap=>{
    pdata.rooms = snap.docs.map(d=>({id:d.id,...d.data()})); scheduleRender();
  }));
  projectSubs.push(db.collection(`projects/${id}/documents`).onSnapshot(snap=>{
    pdata.docs = snap.docs.map(d=>({id:d.id,...d.data()})); scheduleRender();
  }));
  projectSubs.push(db.collection('activity_log').where('projectId','==',id).orderBy('ts','desc').limit(15).onSnapshot(snap=>{
    pdata.activity = snap.docs.map(d=>({id:d.id,...d.data()})); scheduleRender();
  }, err=>console.error('activity sub', err)));
}

function addActivity(projectId, projectName, text){
  if(!db) return;
  db.collection('activity_log').add({ projectId, projectName, text, ts: new Date().toISOString() }).catch(()=>{});
}

/* ---------- modal / form engine ---------- */
function fieldInput(f, value){
  const val = value===undefined||value===null ? '' : value;
  const id = 'f_'+f.key;
  if(f.type==='select'){
    const opts = typeof f.options==='function' ? f.options() : f.options;
    return `<select id="${id}">${!f.required?'<option value="">—</option>':''}${opts.map(o=>{
      const ov = typeof o==='object' ? o.value : o;
      const ol = typeof o==='object' ? o.label : o;
      return `<option value="${escapeHtml(ov)}" ${String(ov)===String(val)?'selected':''}>${escapeHtml(ol)}</option>`;
    }).join('')}</select>`;
  }
  if(f.type==='textarea'){
    return `<textarea id="${id}" rows="${f.rows||3}" placeholder="${escapeHtml(f.placeholder||'')}">${escapeHtml(val)}</textarea>`;
  }
  return `<input id="${id}" type="${f.type||'text'}" value="${escapeHtml(String(val))}" ${f.step?`step="${f.step}"`:''} placeholder="${escapeHtml(f.placeholder||'')}">`;
}

function openModal({title, fields, initial={}, onSave, onDelete, saveLabel='Save', note}){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal">
      <div class="modal-head"><h3>${escapeHtml(title)}</h3><button class="icon-btn" onclick="closeModal()">✕</button></div>
      ${note?`<div style="padding:12px 20px 0;"><div class="callout" style="margin:0;">${note}</div></div>`:''}
      <div class="modal-body">
        ${fields.map(f=>`<div class="field ${f.wide?'wide':''}"><label>${escapeHtml(f.label)}${f.required?' *':''}</label>${fieldInput(f, initial[f.key])}${f.hint?`<span class="hint">${escapeHtml(f.hint)}</span>`:''}</div>`).join('')}
      </div>
      <div class="modal-foot">
        ${onDelete?'<button class="btn danger-ghost sm" id="modalDeleteBtn">Delete</button>':'<span></span>'}
        <div style="display:flex;gap:8px;">
          <button class="btn ghost" onclick="closeModal()">Cancel</button>
          <button class="btn primary" id="modalSaveBtn">${escapeHtml(saveLabel)}</button>
        </div>
      </div>
    </div>
  </div>`;
  document.getElementById('modalBackdrop').addEventListener('mousedown', e=>{ if(e.target.id==='modalBackdrop') closeModal(); });
  document.getElementById('modalSaveBtn').onclick = async ()=>{
    const data = {};
    fields.forEach(f=>{
      const el = document.getElementById('f_'+f.key);
      let v = el.value;
      if(f.type==='number') v = v===''? 0 : parseFloat(v);
      data[f.key] = v;
    });
    const missing = fields.filter(f=>f.required && (data[f.key]===''||data[f.key]===undefined||data[f.key]===null));
    if(missing.length){ toast('Please fill: '+missing.map(f=>f.label).join(', '), 'critical'); return; }
    const btn = document.getElementById('modalSaveBtn');
    btn.disabled = true; btn.textContent = 'Saving…';
    try{ await onSave(data); closeModal(); }
    catch(e){ toast('Save failed: '+(e&&e.message||e), 'critical'); btn.disabled=false; btn.textContent=saveLabel; }
  };
  if(onDelete){
    document.getElementById('modalDeleteBtn').onclick = async ()=>{
      if(!confirm('Delete this record? This cannot be undone.')) return;
      try{ await onDelete(); closeModal(); }
      catch(e){ toast('Delete failed: '+(e&&e.message||e), 'critical'); }
    };
  }
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

/* ---------- CSV export ---------- */
async function exportCSV(filename, headers, rows){
  if(!downloadsCap){ toast('Downloads are not available in this view.', 'warn'); return; }
  const csv = [headers.join(',')].concat(rows.map(r=>r.map(csvEscape).join(','))).join('\r\n');
  try{ await downloadsCap.save({filename, data: csv}); toast('Downloaded '+filename, 'good'); }
  catch(e){ if(e && e.code==='declined') return; toast('Download failed: '+(e&&e.message||e), 'critical'); }
}

/* ---------- shared lookups ---------- */
function clientName(id){ const c = clients.find(c=>c.id===id); return c ? c.name : '—'; }
function projectRoomOptions(){ return pdata.rooms.map(r=>({value:r.id, label:r.name})); }
function roomName(id){ const r = pdata.rooms.find(r=>r.id===id); return r ? r.name : '—'; }
function taskListFor(pid){ return portfolioTasks[pid] || []; }
function boqListFor(pid){ return portfolioBoq[pid] || []; }
function projectCompletion(pid){
  const tasks = taskListFor(pid);
  if(!tasks.length) return null;
  const done = tasks.filter(t=>t.status==='Completed').length;
  return Math.round(done/tasks.length*100);
}

/* ============================================================
   ROUTER
   ============================================================ */
function getParts(){
  let h = location.hash || '';
  h = h.replace(/^#\/?/, '');
  return h.split('/').filter(Boolean);
}
function setActiveNav(key){
  document.querySelectorAll('#sidebar a[data-nav]').forEach(a=>{
    a.classList.toggle('active', a.getAttribute('data-nav')===key);
  });
}
function renderRoute(){
  if(!db){ return; }
  const parts = getParts();
  const app = document.getElementById('app');
  if(!parts.length){ setActiveNav('dashboard'); return renderDashboard(app); }
  if(parts[0]==='projects'){
    setActiveNav('projects');
    if(parts[1]==='new') return renderProjectForm(app);
    return renderProjectsList(app);
  }
  if(parts[0]==='project' && parts[1]){
    setActiveNav('projects');
    return renderProjectWorkspace(app, parts[1], parts[2]||'overview');
  }
  if(parts[0]==='clients'){
    setActiveNav('clients');
    if(parts[1]==='new') return renderClientForm(app);
    return renderClientsList(app);
  }
  if(parts[0]==='client' && parts[1]){
    setActiveNav('clients');
    return renderClientDetail(app, parts[1]);
  }
  if(parts[0]==='equipment'){
    setActiveNav('equipment');
    return renderEquipmentLibrary(app);
  }
  setActiveNav('dashboard'); renderDashboard(app);
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(app){
  const active = projects.filter(p=>p.status!=='Completed' && p.status!=='On Hold');
  const budgetTotal = projects.reduce((s,p)=>s+(Number(p.budget)||0),0);
  const boqTotal = Object.values(portfolioBoq).flat().reduce((s,i)=>s+boqCalc(i).total,0);
  const allTasks = Object.values(portfolioTasks).flat();
  const openTasks = allTasks.filter(t=>t.status!=='Completed');
  const overdueTasks = openTasks.filter(t=>isOverdue(t.dueDate,t.status));

  if(!projects.length){

    title: isEdit ? 'Edit BOQ Item' : 'Add BOQ Item', fields: boqFormFields(),
    initial: item || {qty:1, unit:'Nos', marginPct:20, discountPct:0, gstPct:18, availability:'Available', procurementStatus:'Not Required'},
    saveLabel: isEdit?'Save Changes':'Add Item',
    onDelete: isEdit ? async ()=>{ await deleteBoqItem(projectId, item.id, true); } : null,

async function deleteBoqItem(projectId, itemId, skipConfirm){

function pickLibraryItem(projectId, eq){
  closeModal();
  openBoqForm(projectId, {
    category: eq.category, description: [eq.manufacturer, eq.model].filter(Boolean).join(' '),
    make: eq.manufacturer, model: eq.model, partNumber: eq.partNumber, specification: eq.specification,
    qty:1, unit:'Nos', rate: eq.purchasePrice||0, marginPct: eq.purchasePrice && eq.sellingPrice ? Math.round(((eq.sellingPrice-eq.purchasePrice)/eq.purchasePrice)*100) : 20,
    discountPct:0, gstPct:18, availability:'Available', procurementStatus:'Not Required'
  });
}

function taskFormFields(){

    {key:'remarks', label:'Remarks', type:'textarea', wide:true, rows:2},
  ];
}
function renderTasksTab(slot, project, tasks){
  slot.innerHTML = `
    <div class="panel">
      <div class="panel-head">
        <div class="filters">
          <select id="task-status-filter"><option value="">All statuses</option>${TASK_STATUS.map(s=>`<option>${s}</option>`).join('')}</select>
          <label style="display:flex; align-items:center; gap:5px; font-size:12.5px; color:var(--text-dim);"><input type="checkbox" id="task-overdue-only"> Overdue only</label>
        </div>
        <div style="display:flex; gap:8px;">
          <button class="btn sm" id="task-export">Export CSV</button>
          <button class="btn sm primary" onclick="openTaskForm('${project.id}')">+ Add Task</button>
        </div>
      </div>
      <div class="tblwrap"><table>
        <thead><tr><th>Task</th><th>Room</th><th>Responsible</th><th>Priority</th><th>Status</th><th>Due</th><th></th></tr></thead>
        <tbody id="task-tbody"></tbody>
      </table></div>
    </div>`;
  function currentRows(){
    const sf = document.getElementById('task-status-filter').value;
    const overdueOnly = document.getElementById('task-overdue-only').checked;
    return tasks.filter(t=>{
      if(sf && t.status!==sf) return false;
      if(overdueOnly && !isOverdue(t.dueDate,t.status)) return false;
      return true;
    }).slice().sort((a,b)=>(a.dueDate||'9999').localeCompare(b.dueDate||'9999'));
  }
  function draw(){
    const rows = currentRows();
    document.getElementById('task-tbody').innerHTML = rows.length ? rows.map(t=>`
      <tr class="clickable ${isOverdue(t.dueDate,t.status)?'overdue':''}" onclick='openTaskForm("${project.id}", ${JSON.stringify(t).replace(/'/g,"&#39;")})'>
        <td><strong>${escapeHtml(t.title)}</strong>${t.dependency?`<br><span style="font-size:11px;color:var(--text-faint);">↳ ${escapeHtml(t.dependency)}</span>`:''}</td>
        <td>${escapeHtml(roomName(t.roomId))}</td>
        <td>${escapeHtml(t.responsible||'—')}</td>
        <td>${pill(t.priority||'Medium', priorityCls(t.priority))}</td>
        <td>${pill(t.status||'Not Started', taskStatusCls(t.status))}</td>
        <td>${fmtDate(t.dueDate)}</td>
        <td class="row-actions"><button class="icon-btn" onclick='event.stopPropagation(); deleteTask("${project.id}","${t.id}")'>🗑</button></td>
      </tr>`).join('') : `<tr class="empty-row"><td colspan="7">No tasks match.</td></tr>`;
  }
  ['task-status-filter','task-overdue-only'].forEach(id=>document.getElementById(id).addEventListener('input', draw));
  document.getElementById('task-export').onclick = ()=>{
    const rows = currentRows();
    exportCSV(`Tasks_${project.name.replace(/[^a-z0-9]+/ig,'_')}.csv`,
      ['Task','Room','Responsible','Priority','Status','Start','Due','Dependency','Remarks'],
      rows.map(t=>[t.title, roomName(t.roomId), t.responsible, t.priority, t.status, t.startDate, t.dueDate, t.dependency, t.remarks]));
  };
  draw();
}
function openTaskForm(projectId, task){
  openModal({

    onDelete: task ? async ()=>{ await deleteTask(projectId, task.id, true); } : null,
    onSave: async (data)=>{
      if(task){ await db.doc(`projects/${projectId}/tasks/${task.id}`).update(data); toast('Task updated','good'); }
      else{ await db.collection(`projects/${projectId}/tasks`).add(data); addActivity(projectId, projects.find(p=>p.id===projectId).name, `Task added: ${data.title}`); toast('Task added','good'); }

async function deleteClient(id, skipConfirm){
  const linked = projects.filter(p=>p.clientId===id).length;
  if(linked){
    throw new Error(`${linked} project${linked===1?'':'s'} still linked to this client — reassign or delete ${linked===1?'it':'them'} first.`);
  }
  if(!skipConfirm && !confirm('Delete this client? This cannot be undone.')) return;
  await db.doc(`clients/${id}`).delete();
  toast('Client deleted','good');
  if(location.hash.startsWith('#/client/'+id)) location.hash = '#/clients';
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  try{ db = await claude.use('db'); }catch(e){ db = null; }
  try{ downloadsCap = await claude.use('downloads'); }catch(e){ downloadsCap = null; }

  if(!db){
    document.getElementById('app').innerHTML = `<div class="empty-state"><h2>Live data isn't available in this view</h2><p>Open this page from Claude to use the Command Center with your real project data.</p></div>`;
    return;
  }

  db.collection('clients').onSnapshot(snap=>{
    clients = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    scheduleRender();
  }, err=>console.error('clients sub', err));

  db.collection('projects').onSnapshot(snap=>{
    projects = snap.docs.map(d=>({id:d.id,...d.data()}));
    syncPortfolioSubs();
    scheduleRender();
  }, err=>console.error('projects sub', err));

  db.collection('equipment_library').onSnapshot(snap=>{
    equipment = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.manufacturer||'').localeCompare(b.manufacturer||''));
    scheduleRender();
  }, err=>console.error('equipment sub', err));

  window.addEventListener('hashchange', renderRoute);
  renderRoute();
}
boot();
</script>

</body>
</html>
